[project]
name = "surat-generator"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "docxtpl>=0.20.2",
    "fastapi>=0.141.1",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.4",
    "requests>=2.32.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
